name: Testes de caminhos e recibos PNCP

on:
  push:
    branches:
      - feat/caminhos-dinamicos-recibos-pncp
  pull_request:

jobs:
  caminhos-e-recibos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Executar testes sem publicar no PNCP
        run: python -m unittest discover -s tests -v
